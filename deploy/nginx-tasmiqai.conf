# TasmiqAI Nginx Configuration
# Phase 2: HTTP only, server IP (no domain yet)
# Phase 3: Update server_name to api.tasmiqai.com and add SSL
#
# Install: cp this file to /etc/nginx/sites-available/tasmiqai
# Enable:  ln -s /etc/nginx/sites-available/tasmiqai /etc/nginx/sites-enabled/
# Test:    nginx -t
# Reload:  systemctl reload nginx

server {
    listen 80;
    # Phase 2: matches any hostname (server IP access)
    # Phase 3: change to:  server_name api.tasmiqai.com;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow audio file uploads up to 50MB
    client_max_body_size 50M;

    # Timeouts — Gemini AI can take up to 20s per request
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }
}
